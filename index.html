<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de tablitas de Pozito</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #637083;
      --line: #d9e0ec;
      --soft: #f4f7fb;
      --paper: #ffffff;
      --black: #101724;
      --red: #d33f3f;
      --yellow: #ffd84a;
      --teal: #0f8f73;
      --shadow: 0 18px 42px rgba(23, 32, 51, .11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 143, 115, .12), transparent 34vw),
        radial-gradient(circle at 94% 12%, rgba(211, 63, 63, .12), transparent 28vw),
        linear-gradient(#e7ecf4 1px, transparent 1px) 0 0 / 72px 34px,
        linear-gradient(90deg, #e7ecf4 1px, transparent 1px) 0 0 / 72px 34px,
        #f8fafc;
    }

    button, select, input { font: inherit; color: inherit; }

    .app {
      width: min(1720px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 12px;
      grid-template-rows: auto 1fr;
    }

    .toolbar,
    .sheet-panel,
    .deck-panel {
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(217, 224, 236, .95);
      box-shadow: var(--shadow);
    }

    .toolbar {
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .field.wide,
    .field.show-field {
      grid-column: span 2;
    }

    .brand {
      align-self: center;
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .brand strong {
      font-size: 1.28rem;
      line-height: 1;
    }

    .brand span {
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.15;
      font-weight: 650;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field span,
    .panel-title {
      color: var(--muted);
      font-size: .73rem;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .show-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .check-pill {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 8px;
      font-size: .74rem;
      font-weight: 900;
      cursor: pointer;
    }

    .check-pill input {
      width: 16px;
      height: 16px;
      accent-color: var(--teal);
      flex: 0 0 auto;
    }

    select,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      padding: 0 10px;
      font-weight: 800;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .center-picker {
      position: relative;
      min-width: 0;
    }

    .center-trigger {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      padding: 4px 34px 4px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-weight: 850;
    }

    .center-trigger::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-65%) rotate(45deg);
    }

    .center-trigger .mini-card {
      width: 30px;
      border-width: 1px;
      border-radius: 4px;
      font-size: .48rem;
    }

    .center-picker[open] .center-trigger::after {
      transform: translateY(-35%) rotate(225deg);
    }

    .center-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 6px);
      left: 0;
      width: min(520px, calc(100vw - 28px));
      max-height: min(560px, calc(100vh - 120px));
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .98);
      box-shadow: var(--shadow);
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      display: none;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .center-picker[open] .center-menu {
      display: grid;
    }

    .center-option {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      aspect-ratio: 3 / 4;
      background: #f8fafc;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .center-option:first-child {
      aspect-ratio: auto;
      min-height: 42px;
      grid-column: 1 / -1;
      display: grid;
      place-items: center;
      padding: 0 12px;
      font-weight: 900;
      color: var(--muted);
    }

    .center-option img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    input[type="number"] { appearance: textfield; }

    input[type="color"] {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      padding: 4px;
      cursor: pointer;
    }

    input[type="range"] {
      width: 100%;
      min-height: 40px;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      font-weight: 900;
      box-shadow: 0 2px 0 rgba(23, 32, 51, .04);
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: #aeb8c9;
    }

    .btn.primary {
      background: var(--black);
      border-color: var(--black);
      color: white;
    }

    .btn.danger {
      color: #b42318;
      border-color: #f1b5ae;
      background: #fff7f6;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .48;
      transform: none;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(290px, 23vw, 370px);
      gap: 12px;
      align-items: start;
    }

    .sheet-panel {
      border-radius: 18px;
      padding: 12px;
      overflow: auto;
    }

    .sheet {
      --cols: 4;
      --rows: 3;
      --side-width: 230px;
      --sheet-side-width: var(--side-width);
      --side-card-size: 104px;
      --frame-size: 4px;
      --board-gap: 6px;
      --board-cells: 4;
      --board-ratio: 3 / 4;
      --sheet-bg: #101828;
      --panel-bg: var(--sheet-bg);
      --board-frame-color: #000000;
      --card-bg: #ffffff;
      width: 100%;
      min-width: 760px;
      aspect-ratio: 1170 / 972;
      background: var(--sheet-bg);
      border: 0;
      display: grid;
      grid-template-columns: var(--sheet-side-width) 1fr;
      gap: var(--frame-size);
      padding: var(--frame-size);
    }

    .sheet.no-side {
      --sheet-side-width: 0px;
      grid-template-columns: 1fr;
    }

    .sheet.no-side .side {
      display: none;
    }

    .side {
      background: var(--panel-bg);
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 6px;
      padding: 6px;
      align-content: start;
      min-height: 0;
    }

    .side.hide-center.hide-prefs { grid-template-rows: auto; }
    .side.hide-center:not(.hide-prefs) { grid-template-rows: auto auto; }
    .side:not(.hide-center).hide-prefs { grid-template-rows: auto auto; }

    .count-panel {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      text-align: center;
      padding: 12px 6px;
      background: var(--sheet-bg);
      color: white;
      border-radius: 8px;
    }

    .count-panel strong {
      font-size: clamp(2.1rem, 4vw, 3.5rem);
      line-height: .88;
    }

    .count-panel span {
      font-size: .9rem;
      font-weight: 950;
      text-transform: uppercase;
    }

    .side-box {
      background: var(--panel-bg);
      border: 1px solid #edf1f7;
      border-radius: 8px;
      padding: 5px;
      display: grid;
      grid-template-rows: auto auto;
      gap: 5px;
      justify-items: center;
      align-content: start;
      min-height: 0;
    }

    .side-box[hidden] { display: none !important; }

    .side-list {
      --pref-size: var(--side-card-size);
      width: 100%;
      height: auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 5px;
      justify-items: center;
      align-content: start;
      align-items: center;
    }

    .side-list .mini-card {
      width: min(var(--pref-size), 100%);
      height: auto;
    }

    .cell,
    .card-tile {
      overflow: hidden;
      background: var(--card-bg);
    }

    .mini-card {
      overflow: hidden;
      background: var(--panel-bg);
      width: min(var(--side-card-size), 100%);
      aspect-ratio: 3 / 4;
      border-radius: 6px;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.05;
    }

    .mini-card.center-mark,
    .mini-card.pref-mark { border-color: var(--line); }

    body[data-card-shape="circle"] .mini-card {
      aspect-ratio: 3 / 4;
      border-radius: 6px;
    }

    .boards {
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
      column-gap: var(--board-gap);
      row-gap: var(--board-gap);
      align-content: center;
    }

    body[data-card-shape="circle"] .boards {
      background: #fff;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--board-cells), minmax(0, 1fr));
      grid-template-rows: repeat(var(--board-cells), minmax(0, 1fr));
      column-gap: 1px;
      row-gap: 1px;
      aspect-ratio: var(--board-ratio);
      background: var(--board-frame-color);
      border: 5px solid var(--board-frame-color);
      min-width: 0;
    }

    .cell {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .cell.double::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 3px var(--mark);
    }

    .cell.double { --mark: var(--teal); }

    body[data-card-shape="circle"] .cell {
      display: grid;
      place-items: center;
      background: transparent;
      overflow: visible;
    }

    body[data-card-shape="circle"] .cell.double::after {
      width: 100%;
      aspect-ratio: 1 / 1;
      inset: auto;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    .cell img,
    .mini-card img,
    .card-tile img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cell img {
      object-fit: fill;
    }

    .mini-card img,
    .card-tile img {
      object-fit: contain;
      object-position: center;
    }

    .deck-panel {
      position: sticky;
      top: 12px;
      border-radius: 18px;
      height: calc(100dvh - 28px);
      max-height: calc(100dvh - 28px);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      display: block;
      touch-action: pan-y;
    }

    .deck-panel[open] { display: block; }

    .deck-panel:not([open]) {
      display: block;
    }

    .deck-head,
    .deck-tools,
    .status {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .deck-head {
      display: grid;
      gap: 4px;
      cursor: pointer;
      list-style: none;
    }

    .deck-head::-webkit-details-marker { display: none; }

    .deck-head strong {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .deck-head strong::after {
      content: "Cerrar";
      font-size: .75rem;
      color: var(--muted);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .deck-panel:not([open]) .deck-head strong::after {
      content: "Abrir";
    }

    .deck-head strong { font-size: 1.04rem; }
    .deck-head span { color: var(--muted); font-size: .82rem; font-weight: 700; }

    .deck-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .toggle {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      font-weight: 850;
      font-size: .85rem;
      text-align: center;
    }

    .toggle input {
      width: 15px;
      height: 15px;
      accent-color: var(--teal);
    }

    .status {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
    }

    .status strong { color: var(--ink); }

    .cards {
      height: auto;
      max-height: none;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: max-content;
      gap: 8px;
      overflow: visible;
      touch-action: pan-y;
      align-content: start;
      align-items: start;
      min-height: 0;
      padding-bottom: 18px;
    }

    .card-tile {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      cursor: pointer;
      aspect-ratio: 3 / 4;
      width: 100%;
      height: auto;
      position: relative;
      background: var(--card-bg);
      touch-action: pan-y;
    }

    body[data-card-shape="circle"] .card-tile {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
    }

    body[data-card-shape="circle"] .center-option:not(:first-child) {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
    }

    body[data-card-shape="circle"] .cell img {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: fill;
      object-position: center;
    }

    body[data-card-shape="circle"] .mini-card img {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
      object-fit: contain;
      object-position: center;
    }

    body[data-card-shape="circle"] .card-tile img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: contain;
      object-position: center 26%;
    }

    .card-tile:hover { border-color: #aeb8c9; }
    .card-tile:focus { outline: none; }
    .card-tile:focus-visible { outline: 3px solid #aeb8c9; outline-offset: 2px; }

    .card-tile.is-double { outline: 4px solid var(--teal); outline-offset: -4px; }

    .card-tile img { object-fit: contain; }

    .toast {
      min-height: 20px;
      color: #b43333;
      font-size: .82rem;
      font-weight: 850;
    }

    @media (max-width: 1180px) {
      .toolbar { grid-template-columns: repeat(4, minmax(118px, 1fr)); }
      .brand { grid-column: 1 / -1; }
      .main { grid-template-columns: 1fr; }
      .deck-panel { position: static; height: min(68dvh, 520px); max-height: min(68dvh, 520px); }
      .cards { height: auto; max-height: none; }
      .sheet { min-width: 720px; }
      .center-menu { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      .app { padding: 10px; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .field.wide, .field.show-field, .brand { grid-column: 1 / -1; }
      .btn { padding: 0 8px; }
      .sheet-panel { padding: 8px; }
      .sheet { min-width: 680px; --side-width: 180px; }
      .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .center-menu { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @page { size: landscape; margin: .25in; }

    @media print {
      body { background: white; }
      .toolbar, .deck-panel { display: none !important; }
      .app { width: 100%; min-height: 0; padding: 0; display: block; }
      .main { display: block; }
      .sheet-panel { box-shadow: none; border: 0; border-radius: 0; padding: 0; overflow: visible; }
      .sheet {
        width: 100%;
        min-width: 0;
        height: calc(100vh - .5in);
        border-width: 5px;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="toolbar" aria-label="Controles">
      <label class="field" for="deckSelect">
        <span>Baraja</span>
        <select id="deckSelect"></select>
      </label>

      <label class="field" for="boardCount">
        <span>Tablas</span>
        <input id="boardCount" type="number" min="1" max="30" value="12">
      </label>

      <label class="field" for="boardSize">
        <span>Tipo</span>
        <select id="boardSize">
          <option value="4">4x4 cartas</option>
          <option value="5">5x5 figuritas</option>
        </select>
      </label>

      <label class="field" for="fourBoardLayout">
        <span>4 tablas</span>
        <select id="fourBoardLayout">
          <option value="grid">2 y 2</option>
          <option value="row">Horizontal</option>
        </select>
      </label>

      <div class="field wide">
        <span>Centro opcional</span>
        <select class="visually-hidden" id="centerSelect" tabindex="-1" aria-hidden="true"></select>
        <div class="center-picker" id="centerPicker">
          <button class="center-trigger" id="centerTrigger" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
          <div class="center-menu" id="centerMenu" role="listbox" aria-label="Centro opcional"></div>
        </div>
      </div>

      <div class="field show-field">
        <span>Mostrar</span>
        <div class="show-options">
          <label class="check-pill">
            <input id="showCenterPanel" type="checkbox" checked>
            Centro
          </label>
          <label class="check-pill">
            <input id="showPrefsPanel" type="checkbox" checked>
            Prefs
          </label>
        </div>
      </div>

      <label class="field" for="cardShape">
        <span>Forma</span>
        <select id="cardShape">
          <option value="rectangle">Rectangulo</option>
          <option value="circle">Circular</option>
        </select>
      </label>

      <label class="field" for="sheetColor">
        <span>Fondo</span>
        <input id="sheetColor" type="color" value="#101828">
      </label>

      <label class="field" for="boardFrameColor">
        <span>Marco</span>
        <input id="boardFrameColor" type="color" value="#000000">
      </label>

      <label class="field" for="sideCardSize">
        <span>Lateral</span>
        <input id="sideCardSize" type="range" min="48" max="180" value="104">
      </label>

      <label class="field" for="batchPrefCount">
        <span>Prefs/20</span>
        <input id="batchPrefCount" type="number" min="0" max="4" value="4">
      </label>

      <button class="btn" id="clearBtn" type="button">Limpiar</button>
      <button class="btn" id="addDeckBtn" type="button">Agregar baraja</button>
      <button class="btn danger" id="deleteDeckBtn" type="button">Eliminar baraja</button>
      <input class="visually-hidden" id="deckFolderInput" type="file" accept="image/*" webkitdirectory directory multiple>
      <button class="btn" id="shuffleBtn" type="button">Mezclar</button>
      <button class="btn" id="generateBtn" type="button">Generar</button>
      <button class="btn primary" id="downloadBtn" type="button">Descargar PNG</button>
      <button class="btn primary" id="batchBtn" type="button">20 PNGs</button>
    </section>

    <section class="main">
      <div class="sheet-panel">
        <div class="sheet" id="sheet">
          <aside class="side" id="sidePanel">
            <div class="count-panel">
              <strong id="countBadge">12</strong>
              <span>tablas</span>
            </div>

            <div class="side-box" id="centerBox">
              <div class="panel-title">Centro</div>
              <div id="centerMini" class="mini-card">Sin centro</div>
            </div>

            <div class="side-box" id="prefsBox">
              <div class="panel-title">Preferidas</div>
              <div class="side-list" id="prefMini"></div>
            </div>

          </aside>
          <section class="boards" id="boards"></section>
        </div>
      </div>

      <details class="deck-panel" id="deckPanel" open>
        <summary class="deck-head">
          <strong>Cartas de la baraja</strong>
          <span>Click: agrega o quita preferida. Usa el selector de centro para fijar una carta.</span>
        </summary>

        <div class="deck-tools">
          <label class="toggle">
            <input id="repeatPrefs" type="checkbox">
            Repetir en todas
          </label>
          <label class="toggle">
            <input id="randomPrefPositions" type="checkbox">
            Preferidas ubicacion aleatoria
          </label>
          <label class="toggle">
            <input id="forceAll" type="checkbox" checked>
            Repartir todo el mazo
          </label>

    const CUSTOM_DECK_DB = "pozito-custom-decks";

    const state = {

    const $ = selector => document.querySelector(selector);

    function assetPath(...parts) {
      return parts.map(part => encodeURIComponent(part)).join("/");
    }

    function classicPath(id) {
      return id <= 15
        ? assetPath("carpeta sin titulo", `Imagen ${id}.png`)
        : assetPath("carpeta sin titulo", `${id}.png`);
    }

    function allDecks() {
      return [...DECKS, ...CUSTOM_DECKS];
    }

    function deckById(id) {
      return allDecks().find(deck => deck.id === id) || DECKS[0];
    }

    function currentDeckUsesTransparentCards() {
      const deck = deckById(state.deck);
      return [deck.id, deck.label, deck.folder]
        .filter(Boolean)
        .some(value => String(value).toLowerCase().includes("sin fondo"));
    }

    function whatsAppFiles(deck) {
      if (deck.files) return deck.files;
      const ext = deck.ext || "jpeg";
      const generatedFiles = deck.specs.flatMap(([time, copies, hasPlain]) => {
        const files = [];
        for (let index = 1; index <= copies; index++) {
          files.push(`WhatsApp Image ${deck.date} at ${time} (${index}).${ext}`);
        }
        if (hasPlain) files.push(`WhatsApp Image ${deck.date} at ${time}.${ext}`);
        return files;
      });
      deck.files = [...(deck.extraFiles || []), ...generatedFiles];
      return deck.files;
    }

    function imageFor(id) {
      const deck = deckById(state.deck);
      if (deck.type === "classic") return classicPath(id);
      if (deck.type === "numbered") return assetPath(deck.folder, `${id}.${deck.ext}`);
      if (deck.type === "whatsapp") {
        const files = whatsAppFiles(deck);
        const file = files.length ? files[(id - 1) % files.length] : null;
        return file ? assetPath(deck.folder, file) : classicPath(id);
      }
      if (deck.type === "custom") {
        const src = deck.urls[(id - 1) % deck.urls.length];
        return src || classicPath(id);
      }
      return classicPath(id);
    }

    function figure(id) {
      return FIGURAS.find(item => item.id === Number(id));
    }

    function shuffle(items, random) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function clampBoards(value) {
      return Math.max(1, Math.min(30, Number(value) || 1));
    }

    function clampBoardSize(value) {
      return Number(value) === 5 ? 5 : 4;
    }

    function clampFourBoardLayout(value) {
      return value === "row" ? "row" : "grid";
    }

    function clampBatchPrefCount(value) {
      return Math.max(0, Math.min(4, Number(value) || 0));
    }

    function cardCount() {
      return state.boardSize * state.boardSize;
    }

    function usesClassicRules() {
      return state.boardSize === 4;
    }

    function prefPositions() {
      return usesClassicRules() ? PREF_POSITIONS_4X4 : PREF_POSITIONS_5X5;
    }

    function boardGrid() {
      const count = state.boardCount;
      if (count <= 1) return { cols: 1, rows: 1 };
      if (count <= 3) return { cols: count, rows: 1 };
      if (count === 4) return state.fourBoardLayout === "row"
        ? { cols: 4, rows: 1 }
        : { cols: 2, rows: 2 };
      if (count === 5) return { cols: 5, rows: 1 };
      if (count <= 10) return { cols: Math.ceil(count / 2), rows: 2 };
      if (count <= 12) return { cols: 4, rows: 3 };
      if (count <= 18) return { cols: Math.ceil(count / 3), rows: 3 };
      if (count <= 24) return { cols: Math.ceil(count / 4), rows: 4 };
      return { cols: 6, rows: 5 };
    }

    function showToast(message) {
      $("#toast").textContent = message || "";
    }

    function supportsCustomDecks() {
      return "indexedDB" in window && "URL" in window && "createObjectURL" in URL;
    }

    function dbRequest(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function openCustomDeckDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(CUSTOM_DECK_DB, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(CUSTOM_DECK_STORE)) {
            db.createObjectStore(CUSTOM_DECK_STORE, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function customDeckTransaction(mode, callback) {
      const db = await openCustomDeckDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(CUSTOM_DECK_STORE, mode);
        const store = transaction.objectStore(CUSTOM_DECK_STORE);
        let result;
        transaction.oncomplete = () => {
          db.close();
          resolve(result);
        };
        transaction.onerror = () => {
          db.close();
          reject(transaction.error);
        };
        result = callback(store);
      });
    }

    function runtimeCustomDeck(record) {
      const urls = record.files.map(file => URL.createObjectURL(file.blob));
      return {
        id: record.id,
        label: record.label,
        type: "custom",
        custom: true,
        urls,
        _objectUrls: urls
      };
    }

    function revokeCustomDeck(deck) {
      (deck._objectUrls || []).forEach(url => URL.revokeObjectURL(url));
    }

    async function loadCustomDecks() {
      if (!supportsCustomDecks()) return;
      const records = await customDeckTransaction("readonly", store => dbRequest(store.getAll()));
      records
        .sort((a, b) => fileNameSorter.compare(a.label, b.label))
        .forEach(record => CUSTOM_DECKS.push(runtimeCustomDeck(record)));
    }

    async function saveCustomDeckRecord(record) {
      await customDeckTransaction("readwrite", store => store.put(record));
    }

    async function deleteCustomDeckRecord(id) {
      await customDeckTransaction("readwrite", store => store.delete(id));
    }

    function folderNameFromFiles(files) {
      const relativePath = files[0]?.webkitRelativePath || "";
      return relativePath.split("/")[0] || "Baraja nueva";
    }

    function imageFilesFromSelection(fileList) {
      return Array.from(fileList)
        .filter(file => file.type.startsWith("image/") || IMAGE_FILE_PATTERN.test(file.name))
        .sort((a, b) => {
          const pathA = a.webkitRelativePath || a.name;
          const pathB = b.webkitRelativePath || b.name;
          return fileNameSorter.compare(pathA, pathB);
        });
    }

    function canvasToBlob(canvas, type = "image/jpeg", quality = .9) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }

    async function storedCustomDeckBlob(file) {
      const url = URL.createObjectURL(file);
      try {
        const image = await loadImage(url);
        const fitted = downscaleImage(image, 1400);
        if (fitted instanceof HTMLCanvasElement) {
          return await canvasToBlob(fitted, file.type === "image/png" ? "image/png" : "image/jpeg", .9) || file;
        }
        return file;
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function addCustomDeckFromFiles(fileList) {
      if (!supportsCustomDecks()) {
        showToast("Esta opcion necesita un navegador moderno para guardar barajas.");
        return;
      }

      const imageFiles = imageFilesFromSelection(fileList);
      if (imageFiles.length < 54) {
        showToast(`La carpeta debe tener al menos 54 imagenes. Encontré ${imageFiles.length}.`);
        return;
      }

      const folderName = folderNameFromFiles(imageFiles);
      const label = (window.prompt("Nombre de la baraja:", folderName) || "").trim();
      if (!label) return;

      const selectedFiles = imageFiles.slice(0, 54);
      showToast("Guardando baraja...");
      const record = {
        id: `${CUSTOM_DECK_PREFIX}${Date.now()}`,
        label,
        createdAt: new Date().toISOString(),
        files: await Promise.all(selectedFiles.map(async file => ({
          name: file.name,
          type: file.type || "image/jpeg",
          blob: await storedCustomDeckBlob(file)
        })))
      };

      await saveCustomDeckRecord(record);
      const deck = runtimeCustomDeck(record);
      CUSTOM_DECKS.push(deck);
      CUSTOM_DECKS.sort((a, b) => fileNameSorter.compare(a.label, b.label));
      state.deck = deck.id;
      renderDeckSelect();
      renderAll();
      showToast(`Baraja "${label}" guardada con 54 cartas.`);

    async function deleteCurrentCustomDeck() {
      const deck = deckById(state.deck);
      if (!deck.custom) {
        showToast("Solo puedes eliminar barajas agregadas por el cliente.");
        return;

      if (!window.confirm(`Eliminar la baraja "${deck.label}" de esta app?`)) return;

      await deleteCustomDeckRecord(deck.id);

      const index = CUSTOM_DECKS.findIndex(item => item.id === deck.id);
      if (index >= 0) CUSTOM_DECKS.splice(index, 1);
      state.deck = "clasico";
      renderDeckSelect();
      renderAll();
      showToast(`Baraja "${deck.label}" eliminada.`);

    function safeText(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function fallbackText(id) {
      const fig = figure(id);
      return fig ? `${fig.id}. ${fig.n}` : "";
    }

    function imageHTML(id) {
      const fig = figure(id);
      if (!fig) return "";
      const fallback = safeText(fallbackText(id));
      return `<img src="${imageFor(id)}" alt="${safeText(fig.n)}" onerror="this.replaceWith(document.createTextNode('${fallback}'))">`;
    }

    function validCardId(id) {
      return FIGURAS.some(fig => fig.id === Number(id));
    }

    function uniqueValidIds(ids) {
      return [...new Set(ids.map(Number).filter(validCardId))];
    }

    function sanitizeState() {
      state.boardSize = clampBoardSize(state.boardSize);
      state.fourBoardLayout = clampFourBoardLayout(state.fourBoardLayout);
      state.prefs = uniqueValidIds(state.prefs).slice(0, 4);
      state.doubleIds = uniqueValidIds(state.doubleIds);

      if (!usesClassicRules()) {
        state.center = null;
        state.doubleIds = [];
        state.doubleBoards = false;
        state.doubleSelectMode = false;
        state.showCenterPanel = false;
      }

      if (state.doubleBoards) {
        state.center = null;
        state.showCenterPanel = false;
      } else {
        state.doubleSelectMode = false;
      }

      if (state.randomDoubleCards) {
        state.doubleSelectMode = false;
      }

      if (state.center) {
        state.showCenterPanel = true;
        state.prefs = state.prefs.filter(id => id !== state.center);
        state.doubleIds = state.doubleIds.filter(id => id !== state.center);
      }

      state.prefs = state.prefs.filter(id => !state.doubleIds.includes(id));
    }

    function randomOpenPosition(slots, blocked = new Set()) {
      const positions = [];
      for (let pos = 0; pos < cardCount(); pos++) {
        if (!slots[pos] && !blocked.has(pos)) positions.push(pos);
      }
      return positions[Math.floor(Math.random() * positions.length)];
    }

    function doubleIdsForBoards(ids, random) {
      if (!usesClassicRules() || !state.doubleBoards) return [];

      const preferredIds = new Set(state.prefs);
      const usableIds = ids.filter(id => !preferredIds.has(id));
      const fallbackIds = usableIds.length ? usableIds : ids;

      if (state.randomDoubleCards) {
        return shuffle(fallbackIds, random).slice(0, state.boardCount);
      }

      if (!state.doubleIds.length) return [];

      const selected = state.doubleIds.filter(id => fallbackIds.includes(id));
      const selectedSet = new Set(selected);
      const fill = shuffle(fallbackIds.filter(id => !selectedSet.has(id)), random);
      return [...selected, ...fill].slice(0, state.boardCount);
    }

    function preferredPlacementsForBoard(boardIndex) {
      if (!state.prefs.length) return null;
      const positions = prefPositions();
      if (state.repeatPrefs) {
        return state.prefs.map((id, index) => ({
          id,
          pos: positions[index]
        }));
      }

      const groupPosition = boardIndex % 4;
      if (groupPosition >= state.prefs.length) return [];
      return [{
        id: state.prefs[groupPosition],
        pos: positions[groupPosition]
      }];
    }

    function buildBoards() {
      const random = Math.random;
      const ids = FIGURAS.map(fig => fig.id);
      const blockedFillerIds = new Set(state.prefs);
      const boardDoubleIds = doubleIdsForBoards(ids, random);
      if (state.doubleBoards) boardDoubleIds.forEach(id => blockedFillerIds.add(id));
      const globalCounts = new Map(ids.map(id => [id, 0]));
      const boardData = [];

      const placeCard = (slots, used, id, pos, allowDuplicate = false) => {
        if (!id || slots[pos] || (!allowDuplicate && used.has(id))) return false;
        slots[pos] = id;
        used.add(id);
        globalCounts.set(id, globalCounts.get(id) + 1);
        return true;
      };

      const balancedCard = (slots, used) => {
        let candidates = ids.filter(id => (
          !used.has(id) &&
          !blockedFillerIds.has(id)
        ));

        if (!candidates.length) {
          candidates = ids.filter(id => !used.has(id));
        }

        const ordered = shuffle(candidates, random);
        if (!state.forceAll) return ordered[0];

        ordered.sort((a, b) => (
          globalCounts.get(a) - globalCounts.get(b) || random() - .5
        ));
        return ordered[0];
      };

      for (let boardIndex = 0; boardIndex < state.boardCount; boardIndex++) {
        const slots = new Array(cardCount()).fill(null);
        const used = new Set();
        const preferredPlacements = preferredPlacementsForBoard(boardIndex) || [];
        const doubleId = boardDoubleIds[boardIndex] || null;

        if (doubleId) {
          DOUBLE_POSITIONS.forEach((pos, index) => {
            placeCard(slots, used, doubleId, pos, index > 0);
          });
        } else if (state.center) {
          placeCard(slots, used, state.center, CENTER_POS);
        }

        preferredPlacements.forEach(({ id, pos }) => {
          if (id === state.center || id === doubleId) return;
          const targetPos = state.randomPrefPositions
            ? randomOpenPosition(slots, usesClassicRules() ? new Set(DOUBLE_POSITIONS) : new Set())
            : pos;
          placeCard(slots, used, id, targetPos);
        });

        boardData.push({ slots, used });
      }

      boardData.forEach(({ slots, used }) => {
        for (let pos = 0; pos < cardCount(); pos++) {
          if (slots[pos]) continue;

          const card = balancedCard(slots, used);
          placeCard(slots, used, card, pos);
        }
      });

      state.boards = boardData.map(({ slots }) => slots);
    }

    function renderCenterSelect() {
      $("#centerSelect").innerHTML = [
        `<option value="">Sin centro</option>`,
        ...FIGURAS.map(fig => `<option value="${fig.id}">${fig.id}. ${safeText(fig.n)}</option>`)
      ].join("");

    function renderDeckSelect() {
      const defaultOptions = DECKS.map(deck => (
        `<option value="${deck.id}">${safeText(deck.label)}</option>`
      )).join("");
      const customOptions = CUSTOM_DECKS.map(deck => (
        `<option value="${deck.id}">${safeText(deck.label)}</option>`
      )).join("");
      $("#deckSelect").innerHTML = customOptions
        ? `<optgroup label="Incluidas">${defaultOptions}</optgroup><optgroup label="Agregadas">${customOptions}</optgroup>`
        : defaultOptions;
      if (!allDecks().some(deck => deck.id === state.deck)) state.deck = "clasico";
      $("#deckSelect").value = state.deck;
    }

    function renderCards() {
      const prefSet = new Set(state.prefs);
      const doubleSet = new Set(state.doubleIds);
      $("#cards").innerHTML = FIGURAS.map(fig => {
        const classes = [
          "card-tile",
          state.center === fig.id ? "is-center" : "",
          prefSet.has(fig.id) ? "is-pref" : "",
          doubleSet.has(fig.id) ? "is-double" : ""
        ].filter(Boolean).join(" ");
        return `
          <button class="${classes}" type="button" data-card="${fig.id}" aria-label="${safeText(fig.n)}">
            ${imageHTML(fig.id)}
          </button>
        `;
      }).join("");

      document.querySelectorAll("[data-card]").forEach(button => {
        button.addEventListener("click", () => {
          const id = Number(button.dataset.card);
          state.doubleSelectMode ? toggleDoubleCard(id) : togglePreferred(id);
        });
      });
    }

    function renderCenterPicker() {
      $("#centerSelect").value = state.center || "";
      $("#centerTrigger").innerHTML = state.center
        ? renderMiniCard(state.center, "center-mark", "")
        : `<span>Sin centro</span>`;

      $("#centerMenu").innerHTML = [
        `<button class="center-option${state.center ? "" : " is-selected"}" type="button" data-center="" role="option" aria-selected="${state.center ? "false" : "true"}">Sin centro</button>`,
        ...FIGURAS.map(fig => {
          const selected = state.center === fig.id;
          return `
            <button class="center-option${selected ? " is-selected" : ""}" type="button" data-center="${fig.id}" role="option" aria-selected="${selected ? "true" : "false"}" aria-label="${safeText(fig.n)}">
              ${imageHTML(fig.id)}
            </button>
          `;
        })
      ].join("");

      document.querySelectorAll("[data-center]").forEach(button => {
        button.addEventListener("click", () => selectCenter(button.dataset.center));
      });

    function setCenterPickerOpen(isOpen) {
      $("#centerPicker").toggleAttribute("open", isOpen);
      $("#centerTrigger").setAttribute("aria-expanded", isOpen ? "true" : "false");
    }

    function selectCenter(value) {
      if (!usesClassicRules()) {
        showToast("Centro no aplica en tablas 5x5.");
        return;
      }
      state.center = value ? Number(value) : null;
      if (state.center) {
        state.doubleBoards = false;
        state.doubleSelectMode = false;
        state.showCenterPanel = true;
      }
      state.prefs = state.prefs.filter(id => id !== state.center);
      state.doubleIds = state.doubleIds.filter(id => id !== state.center);
      setCenterPickerOpen(false);
      renderAll();
    }

    function renderMiniCard(id, kind, emptyText) {
      if (!id) return `<div class="mini-card">${emptyText}</div>`;

    function fitSideMiniCards() {
      const sheet = $("#sheet");
      const side = $("#sidePanel");
      const centerBox = $("#centerBox");
      const prefsBox = $("#prefsBox");
      const list = $("#prefMini");
      const centerCount = state.showCenterPanel ? 1 : 0;
      const prefCount = state.showPrefsPanel ? Math.max(1, state.prefs.length) : 0;
      const visibleCardCount = centerCount + prefCount;

      if (!visibleCardCount) return;

      const gap = 8;
      const sideStyles = getComputedStyle(side);
      const sideGap = parseFloat(sideStyles.rowGap) || 0;
      const sidePadding = (parseFloat(sideStyles.paddingTop) || 0) + (parseFloat(sideStyles.paddingBottom) || 0);
      const countHeight = $(".count-panel").offsetHeight || 0;
      const centerChrome = state.showCenterPanel
        ? Math.max(0, centerBox.offsetHeight - ($("#centerMini").offsetHeight || 0))
        : 0;
      const prefsChrome = state.showPrefsPanel
        ? Math.max(0, prefsBox.offsetHeight - list.offsetHeight)
        : 0;
      const visibleBoxes = 1 + Number(state.showCenterPanel) + Number(state.showPrefsPanel);
      const usedGaps = sideGap * Math.max(0, visibleBoxes - 1);
      const prefGaps = state.showPrefsPanel ? gap * Math.max(0, prefCount - 1) : 0;
      const availableHeight = side.clientHeight - sidePadding - countHeight - centerChrome - prefsChrome - usedGaps - prefGaps;
      const heightLimitedWidth = availableHeight > 0
        ? (availableHeight / visibleCardCount) * .75
        : state.sideCardSize;
      const widthLimits = [side.clientWidth || Infinity];
      if (state.showCenterPanel) widthLimits.push(centerBox.clientWidth || Infinity);
      if (state.showPrefsPanel) widthLimits.push(prefsBox.clientWidth || Infinity);
      const availableWidth = Math.min(...widthLimits);
      const cardWidth = Math.floor(Math.min(state.sideCardSize, availableWidth, heightLimitedWidth));
      const fittedSize = `${Math.max(28, cardWidth)}px`;

      sheet.style.setProperty("--side-card-size", fittedSize);
      if (state.showPrefsPanel) {
        list.style.gridTemplateRows = `repeat(${prefCount}, auto)`;
        list.style.setProperty("--pref-size", fittedSize);
      }
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function downscaleImage(img, maxSize = 900) {
      const width = img.naturalWidth || img.width;
      const height = img.naturalHeight || img.height;
      const biggestSide = Math.max(width, height);
      if (!width || !height || biggestSide <= maxSize) return img;

      const scale = maxSize / biggestSide;
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      const context = canvas.getContext("2d");
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    async function loadCardImage(id) {
      try {
        return downscaleImage(await loadImage(imageFor(id)));
      } catch (error) {
        return downscaleImage(await loadImage(classicPath(id)));
      }
    }

    function relativeRect(element, base) {
      const rect = element.getBoundingClientRect();
      return {
        x: rect.left - base.left,
        y: rect.top - base.top,
        w: rect.width,
        h: rect.height
      };
    }

    function pixelRect(element, base) {
      const rect = relativeRect(element, base);
      const x = Math.round(rect.x);
      const y = Math.round(rect.y);
      return {
        x,
        y,
        w: Math.round(rect.x + rect.w) - x,
        h: Math.round(rect.y + rect.h) - y
      };
    }

    function roundedRectPath(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    function drawImageCover(context, img, x, y, width, height, focusY = .5) {
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const imageRatio = iw / ih;
      const targetRatio = width / height;
      let sx = 0;
      let sy = 0;
      let sw = iw;
      let sh = ih;

      if (imageRatio > targetRatio) {
        sw = ih * targetRatio;
        sx = (iw - sw) / 2;
      } else {
        sh = iw / targetRatio;
        sy = (ih - sh) * focusY;
      }

      context.drawImage(img, sx, sy, sw, sh, x, y, width, height);
    }

    function drawImageFill(context, img, x, y, width, height) {
      context.drawImage(img, x, y, width, height);
    }

    function drawImageContain(context, img, x, y, width, height) {
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const scale = Math.min(width / iw, height / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      context.drawImage(img, x + (width - dw) / 2, y + (height - dh) / 2, dw, dh);
    }

    function drawPanelBox(context, rect) {
      roundedRectPath(context, rect.x, rect.y, rect.w, rect.h, 8);
      context.fillStyle = state.sheetColor;
      context.fill();
      context.lineWidth = 1;
      context.strokeStyle = "#edf1f7";
      context.stroke();
    }

    function drawCenteredText(context, text, x, y, size, weight = 900, color = "#ffffff") {
      context.fillStyle = color;
      context.font = `${weight} ${size}px Inter, Arial, sans-serif`;
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(text, x, y);
    }

    async function imageCacheFor(ids) {
      const uniqueIds = [...new Set(ids.filter(Boolean))];
      const entries = await Promise.all(uniqueIds.map(async id => [id, await loadCardImage(id)]));
      return new Map(entries);
    }

    function drawMiniCard(context, img, rect) {
      roundedRectPath(context, rect.x, rect.y, rect.w, rect.h, 6);
      context.fillStyle = state.sheetColor;
      context.fill();
      context.save();
      roundedRectPath(context, rect.x, rect.y, rect.w, rect.h, 6);
      context.clip();
      drawImageContain(context, img, rect.x, rect.y, rect.w, rect.h);
      context.restore();
      context.lineWidth = 2;
      context.strokeStyle = "#d9e0ec";
      context.stroke();
    }

    async function renderSheetPNGDataUrl() {
      const sheet = $("#sheet");
      const sheetRect = sheet.getBoundingClientRect();
      const sheetStyles = getComputedStyle(sheet);
      const width = Math.ceil(Math.max(sheetRect.width, sheet.scrollWidth));
      const height = Math.ceil(Math.max(sheetRect.height, sheet.scrollHeight));
      const scale = 2;
      const allIds = [
        state.center,
        ...state.prefs,
        ...state.boards.flat()
      ];

      try {
        const images = await imageCacheFor(allIds);
        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = height * scale;
        const context = canvas.getContext("2d");
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        context.scale(scale, scale);

        context.fillStyle = state.sheetColor;
        context.fillRect(0, 0, width, height);

        const sideVisible = state.showCenterPanel || state.showPrefsPanel;
        const transparentCards = currentDeckUsesTransparentCards();
        if (sideVisible) {
          const countRect = relativeRect($(".count-panel"), sheetRect);
          drawCenteredText(context, String(state.boardCount), countRect.x + countRect.w / 2, countRect.y + countRect.h / 2 - 11, Math.min(64, countRect.w * .38));
          drawCenteredText(context, "TABLAS", countRect.x + countRect.w / 2, countRect.y + countRect.h / 2 + 30, 20, 950);

          if (state.showCenterPanel) {
            const box = $("#centerBox");
            const rect = relativeRect(box, sheetRect);
            drawPanelBox(context, rect);
            drawCenteredText(context, "CENTRO", rect.x + rect.w / 2, rect.y + 22, 14, 900, "#7a8497");
            if (state.center) {
              drawMiniCard(context, images.get(state.center), relativeRect($("#centerMini"), sheetRect), "#ffd84a");
            } else if (state.doubleBoards) {
              const miniRect = relativeRect($("#centerMini"), sheetRect);
              roundedRectPath(context, miniRect.x, miniRect.y, miniRect.w, miniRect.h, 6);
              context.lineWidth = 2;
              context.strokeStyle = "#ffd84a";
              context.stroke();
              drawCenteredText(context, "DOBLES", miniRect.x + miniRect.w / 2, miniRect.y + miniRect.h / 2, Math.min(18, miniRect.w * .2), 900, "#7a8497");
            }
          }

          if (state.showPrefsPanel) {
            const box = $("#prefsBox");
            const rect = relativeRect(box, sheetRect);
            drawPanelBox(context, rect);
            drawCenteredText(context, "PREFERIDAS", rect.x + rect.w / 2, rect.y + 22, 14, 900, "#7a8497");
            state.prefs.forEach((id, index) => {
              const card = $("#prefMini").children[index];
              if (card) drawMiniCard(context, images.get(id), relativeRect(card, sheetRect), "#d33f3f");
            });
          }
        }

        if (state.cardShape === "circle") {
          const boardsRect = relativeRect($("#boards"), sheetRect);
          context.fillStyle = "#ffffff";
          context.fillRect(boardsRect.x, boardsRect.y, boardsRect.w, boardsRect.h);
        }

        document.querySelectorAll(".board").forEach((board, boardIndex) => {
          const boardRect = pixelRect(board, sheetRect);
          context.fillStyle = state.boardFrameColor;
          context.fillRect(boardRect.x, boardRect.y, boardRect.w, boardRect.h);
          const slots = state.boards[boardIndex];

          [...board.children].forEach((cell, pos) => {
            const id = slots[pos];
            const img = images.get(id);
            const rect = pixelRect(cell, sheetRect);
            const isDouble = usesClassicRules() && state.doubleBoards && DOUBLE_POSITIONS.includes(pos) && slots[DOUBLE_POSITIONS[0]] === slots[DOUBLE_POSITIONS[1]];
            if (!img) return;

            if (state.cardShape === "circle") {
              const size = Math.min(rect.w, rect.h);
              const x = rect.x + (rect.w - size) / 2;
              const y = rect.y + (rect.h - size) / 2;
              context.save();
              context.beginPath();
              context.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
              context.clip();
              drawImageFill(context, img, x, y, size, size);
              context.restore();
              if (isDouble) {
                context.lineWidth = 4;
                context.strokeStyle = "#0f9f9a";
                context.beginPath();
                context.arc(x + size / 2, y + size / 2, size / 2 - 2, 0, Math.PI * 2);
                context.stroke();
              }
            } else {
              context.fillStyle = transparentCards ? state.sheetColor : "#ffffff";
              context.fillRect(rect.x, rect.y, rect.w, rect.h);
              context.save();
              context.beginPath();
              context.rect(rect.x, rect.y, rect.w, rect.h);
              context.clip();
              drawImageFill(context, img, rect.x, rect.y, rect.w, rect.h);
              context.restore();
              if (isDouble) {
                context.lineWidth = 4;
                context.strokeStyle = "#0f9f9a";
                context.strokeRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);
              }
            }
          });
        });

        const filename = `tablitas-pozito-${state.boardCount}.png`;
        const dataUrl = canvas.toDataURL("image/png");
        return { dataUrl, filename };
      } catch (error) {
        console.error(error);
        throw error;
      }
    }

    async function downloadDataUrl(dataUrl, filename, directoryHandle = null) {
      if (directoryHandle) {
        const response = await fetch(dataUrl);
        const blob = await response.blob();
        const fileHandle = await directoryHandle.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      }

      const link = document.createElement("a");
      link.download = filename;
      link.href = dataUrl;
      link.click();
    }

    async function downloadSheetPNG() {
      const button = $("#downloadBtn");
      button.disabled = true;
      button.textContent = "Preparando...";

      try {
        const { dataUrl, filename } = await renderSheetPNGDataUrl();
        await downloadDataUrl(dataUrl, filename);
        showToast("");
      } catch (error) {
        showToast("No se pudo descargar el PNG. Revisa que la pagina este abierta desde http://localhost:8000.");
        console.error(error);
      } finally {
        button.disabled = false;
        button.textContent = "Descargar PNG";
      }
    }

    function nextFrame() {
      return new Promise(resolve => requestAnimationFrame(() => resolve()));
    }

    function snapshotState() {
      return {
        ...state,
        prefs: [...state.prefs],
        doubleIds: [...state.doubleIds],
        boards: state.boards.map(slots => [...slots])
      };
    }

    function restoreState(snapshot) {
      Object.assign(state, {
        ...snapshot,
        prefs: [...snapshot.prefs],
        doubleIds: [...snapshot.doubleIds],
        boards: snapshot.boards.map(slots => [...slots])
      });
    }

    function countMap(ids) {
      return new Map(ids.map(id => [id, 0]));
    }

    function leastUsedIds(count, counts, blocked = new Set(), weight = 1) {
      const candidates = FIGURAS
        .map(fig => fig.id)
        .filter(id => !blocked.has(id))
        .sort((a, b) => counts.get(a) - counts.get(b) || Math.random() - .5);
      const picked = candidates.slice(0, count);
      picked.forEach(id => counts.set(id, counts.get(id) + weight));
      return picked;
    }

    async function chooseBatchDirectory() {
      if (!window.showDirectoryPicker) return null;
      try {
        return await window.showDirectoryPicker({ mode: "readwrite" });
      } catch (error) {
        if (error && error.name === "AbortError") throw error;
        return null;
      }
    }

    async function downloadBatchPNGs() {
      const button = $("#batchBtn");
      const original = snapshotState();
      const ids = FIGURAS.map(fig => fig.id);
      const prefCounts = countMap(ids);
      const centerCounts = countMap(ids);
      const doubleCounts = countMap(ids);
      let directoryHandle = null;

      button.disabled = true;
      $("#downloadBtn").disabled = true;

      try {
        directoryHandle = await chooseBatchDirectory();
        for (let index = 1; index <= 20; index++) {
          button.textContent = `${index}/20`;

          if (original.doubleBoards) {
            const prefCount = original.showPrefsPanel ? clampBatchPrefCount(original.batchPrefCount) : 0;
            const fixedPrefs = original.prefs.slice(0, prefCount);
            const randomPrefs = leastUsedIds(
              Math.max(0, prefCount - fixedPrefs.length),
              prefCounts,
              new Set(fixedPrefs),
              state.boardCount
            );
            state.doubleBoards = true;
            state.randomDoubleCards = false;
            state.doubleSelectMode = false;
            state.center = null;
            state.prefs = [...fixedPrefs, ...randomPrefs];
            state.repeatPrefs = prefCount > 0;
            state.showCenterPanel = false;
            state.showPrefsPanel = original.showPrefsPanel && prefCount > 0;
            state.doubleIds = leastUsedIds(state.boardCount, doubleCounts, new Set(state.prefs));
          } else {
            const prefCount = original.showPrefsPanel ? clampBatchPrefCount(original.batchPrefCount) : 0;
            const useCenter = Boolean(original.showCenterPanel);
            state.doubleBoards = false;
            state.randomDoubleCards = true;
            state.doubleSelectMode = false;
            state.doubleIds = [];
            state.repeatPrefs = prefCount > 0;
            state.showPrefsPanel = original.showPrefsPanel && prefCount > 0;
            state.showCenterPanel = useCenter;
            const fixedPrefs = original.prefs.slice(0, prefCount);
            const randomPrefs = leastUsedIds(
              Math.max(0, prefCount - fixedPrefs.length),
              prefCounts,
              new Set(fixedPrefs),
              state.boardCount
            );
            state.prefs = [...fixedPrefs, ...randomPrefs];
            state.center = useCenter
              ? leastUsedIds(1, centerCounts, new Set(state.prefs), state.boardCount)[0] || null
              : null;
          }

          renderAll();
          await nextFrame();
          const { dataUrl } = await renderSheetPNGDataUrl();
          const mode = original.doubleBoards ? "dobles" : "preferidas";
          const filename = `juego-${mode}-${String(index).padStart(2, "0")}.png`;
          await downloadDataUrl(dataUrl, filename, directoryHandle);
        }

        showToast(directoryHandle
          ? "Listo: se guardaron 20 PNGs en la carpeta elegida."
          : "Listo: se descargaron 20 PNGs.");
      } catch (error) {
        if (!error || error.name !== "AbortError") {
          showToast("No se pudo generar el paquete de 20 PNGs.");
          console.error(error);
        }
      } finally {
        restoreState(original);
        renderAll();
        button.disabled = false;
        $("#downloadBtn").disabled = false;
        button.textContent = "20 PNGs";
      }
    }

    function sidePanelWidth(showSide) {
      if (!showSide) return 0;
      return Math.round(Math.max(140, Math.min(300, state.sideCardSize + 82)));
    }

    function renderSheet() {
      const { cols, rows } = boardGrid();
      const frameSize = 4;
      const boardGap = 6;
      const showSide = state.showCenterPanel || state.showPrefsPanel;
      const boardCells = state.boardSize;
      $("#sheet").style.setProperty("--cols", cols);
      $("#sheet").style.setProperty("--rows", rows);
      $("#sheet").style.setProperty("--board-cells", boardCells);
      $("#sheet").style.setProperty("--board-ratio", usesClassicRules() ? "3 / 4" : "1 / 1");
      $("#sheet").style.setProperty("--board-gap", `${boardGap}px`);
      $("#sheet").style.setProperty("--frame-size", `${frameSize}px`);
      applyTheme();
      $("#sheet").classList.toggle("no-side", !showSide);
      const sideWidth = sidePanelWidth(showSide);
      const sideGap = showSide ? frameSize : 0;
      const boardWidth = usesClassicRules() ? 240 : 280;
      const boardHeight = usesClassicRules() ? 320 : 280;
      const sheetWidth = frameSize * 2 + sideWidth + sideGap + cols * boardWidth + (cols - 1) * boardGap;
      const sheetHeight = frameSize * 2 + rows * boardHeight + (rows - 1) * boardGap;
      $("#sheet").style.setProperty("--side-width", `${sideWidth}px`);
      $("#sheet").style.aspectRatio = `${sheetWidth} / ${sheetHeight}`;
      $("#countBadge").textContent = state.boardCount;
      $("#sidePanel").classList.toggle("hide-center", !state.showCenterPanel);
      $("#sidePanel").classList.toggle("hide-prefs", !state.showPrefsPanel);
      $("#centerBox").hidden = !state.showCenterPanel;
      $("#prefsBox").hidden = !state.showPrefsPanel;
      const centerMini = state.doubleBoards
        ? `<div id="centerMini" class="mini-card center-mark">Dobles</div>`
        : renderMiniCard(state.center, "center-mark", "Sin centro").replace("<div", "<div id=\"centerMini\"");
      $("#centerMini").outerHTML = centerMini;
      $("#prefMini").innerHTML = state.prefs.length
        ? state.prefs.map(id => renderMiniCard(id, "pref-mark", "")).join("")
        : `<div class="mini-card">Sin preferidas</div>`;
      fitSideMiniCards();

      $("#boards").innerHTML = state.boards.map((slots, boardIndex) => {
        const preferredIds = new Set((preferredPlacementsForBoard(boardIndex) || []).map(item => item.id));
        const cells = slots.map((id, pos) => {
          const isDouble = usesClassicRules() && state.doubleBoards && DOUBLE_POSITIONS.includes(pos) && slots[DOUBLE_POSITIONS[0]] === slots[DOUBLE_POSITIONS[1]];
          const classes = [
            "cell",
            usesClassicRules() && state.center && pos === CENTER_POS && id === state.center ? "center" : "",
            preferredIds.has(id) ? "preferred" : "",
            isDouble ? "double" : ""
          ].filter(Boolean).join(" ");
          return `<div class="${classes}">${imageHTML(id)}</div>`;
        }).join("");
        return `<div class="board" aria-label="Tabla ${boardIndex + 1}">${cells}</div>`;
      }).join("");

    }

    function renderStatus() {
      const center = !usesClassicRules()
        ? "No aplica en 5x5"
        : (state.doubleBoards ? "Usando tablas dobles" : (state.center ? fallbackText(state.center) : "Sin centro"));
      const doubleStatus = state.randomDoubleCards
        ? "Aleatorios"
        : `${state.doubleIds.length} seleccionada${state.doubleIds.length === 1 ? "" : "s"}`;
      $("#centerStatus").textContent = center;
      $("#prefStatus").textContent = `${state.prefs.length} de 4${state.repeatPrefs ? ", en todas" : ", por bloque"}${state.randomPrefPositions ? ", aleatorias" : ""}`;
      $("#doubleStatus").textContent = !usesClassicRules() ? "No aplican en 5x5" : (state.doubleBoards ? doubleStatus : "Apagadas");
      $("#boardCount").value = state.boardCount;
      $("#boardSize").value = state.boardSize;
      $("#fourBoardLayout").value = state.fourBoardLayout;
      $("#fourBoardLayout").disabled = state.boardCount !== 4;
      $("#batchPrefCount").value = state.batchPrefCount;
      $("#deleteDeckBtn").disabled = !deckById(state.deck).custom;
    }

    function renderAll() {
      showToast("");
      sanitizeState();
      buildBoards();
      renderStatus();
      renderCenterPicker();
      renderCards();
      renderSheet();
    }

    function toggleDoubleCard(id) {
      if (!usesClassicRules()) {
        showToast("Dobles no aplica en tablas 5x5.");
        return;
      }
      if (state.doubleIds.includes(id)) {
        state.doubleIds = state.doubleIds.filter(doubleId => doubleId !== id);
      } else {
        state.doubleIds.push(id);
      }

      state.doubleBoards = true;
      state.randomDoubleCards = false;
      state.center = null;
      state.prefs = state.prefs.filter(pref => pref !== id);
      renderAll();
    }

    function togglePreferred(id) {
      if (state.center === id) {
        showToast("Esa carta ya esta en el centro. Quita el centro o elige otra preferida.");
        return;
      }
      if (state.doubleIds.includes(id)) {
        showToast("Esa carta ya esta en dobles. Quitala de dobles para usarla como preferida.");
        return;
      }

      if (state.prefs.includes(id)) {
        state.prefs = state.prefs.filter(pref => pref !== id);
      } else if (state.prefs.length >= 4) {
        showToast("Maximo 4 preferidas. Quita una para agregar otra.");
        return;
      } else {
        state.prefs.push(id);
      }

      renderAll();
    }

    $("#deckSelect").addEventListener("change", event => {
      state.deck = event.target.value;
      renderAll();
    });

    $("#addDeckBtn").addEventListener("click", () => {
      $("#deckFolderInput").value = "";
      $("#deckFolderInput").click();

    $("#deckFolderInput").addEventListener("change", async event => {

        await addCustomDeckFromFiles(event.target.files);

    $("#deleteDeckBtn").addEventListener("click", async () => {

    $("#boardCount").addEventListener("change", event => {

    $("#boardSize").addEventListener("change", event => {
      state.boardSize = clampBoardSize(event.target.value);

    $("#centerTrigger").addEventListener("click", () => {
      if (!usesClassicRules()) {
        showToast("Centro no aplica en tablas 5x5.");
        return;
      }
      const isOpen = $("#centerPicker").hasAttribute("open");
      setCenterPickerOpen(!isOpen);
    });

    document.addEventListener("click", event => {
      if (!$("#centerPicker").contains(event.target)) setCenterPickerOpen(false);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") setCenterPickerOpen(false);
    });

    $("#sheetColor").addEventListener("input", event => {
      state.sheetColor = event.target.value;
      applyTheme();
    });

    $("#boardFrameColor").addEventListener("input", event => {
      state.boardFrameColor = event.target.value;
      applyTheme();
    });

    $("#sideCardSize").addEventListener("input", event => {
      state.sideCardSize = Number(event.target.value) || 104;
      renderSheet();
    });

    $("#cardShape").addEventListener("change", event => {
      state.cardShape = event.target.value;
      renderSheet();
    });

    $("#showCenterPanel").addEventListener("change", event => {
      if (!usesClassicRules()) {
        state.showCenterPanel = false;
        renderAll();
        return;
      }
      state.showCenterPanel = event.target.checked;
      if (state.showCenterPanel && state.doubleBoards) {
        state.doubleBoards = false;
        state.doubleSelectMode = false;
      }
      renderSheet();
    });

    $("#showPrefsPanel").addEventListener("change", event => {
      state.showPrefsPanel = event.target.checked;
      renderSheet();
    });

    $("#repeatPrefs").addEventListener("change", event => {
      state.repeatPrefs = event.target.checked;
      renderAll();
    });

    $("#randomPrefPositions").addEventListener("change", event => {
      state.randomPrefPositions = event.target.checked;
      renderAll();
    });

    $("#forceAll").addEventListener("change", event => {
      state.forceAll = event.target.checked;
      renderAll();
    });

    $("#doubleBoards").addEventListener("change", event => {
      if (!usesClassicRules()) {
        state.doubleBoards = false;
        state.doubleSelectMode = false;
        renderAll();
        return;
      }
      state.doubleBoards = event.target.checked;
      if (state.doubleBoards) {
        state.center = null;
        state.showCenterPanel = false;
      } else {
        state.doubleSelectMode = false;
      }
      renderAll();
    });

    $("#randomDoubleCards").addEventListener("change", event => {
      if (!usesClassicRules()) {
        state.randomDoubleCards = event.target.checked;
        state.doubleIds = [];
        state.doubleBoards = false;
        state.doubleSelectMode = false;
        renderAll();
        showToast("Dobles no aplica en tablas 5x5.");
        return;
      }
      state.randomDoubleCards = event.target.checked;
      state.doubleBoards = true;
      state.center = null;
      state.showCenterPanel = false;
      state.doubleSelectMode = !state.randomDoubleCards;
      $("#deckPanel").open = true;
      renderAll();
      if (!state.randomDoubleCards) {
        $("#cards").scrollIntoView({ block: "nearest" });
        showToast("Modo manual activo: da click en las cartas que quieres usar como dobles.");
      }
    });

    $("#clearBtn").addEventListener("click", () => {
      state.center = null;
      state.prefs = [];
      state.doubleIds = [];
      state.doubleSelectMode = false;
      renderCenterSelect();
      renderAll();
    });

    $("#shuffleBtn").addEventListener("click", () => {
      renderAll();
    });

    $("#generateBtn").addEventListener("click", renderAll);
    $("#downloadBtn").addEventListener("click", downloadSheetPNG);
    $("#batchBtn").addEventListener("click", downloadBatchPNGs);
    window.addEventListener("resize", fitSideMiniCards);

    async function initApp() {
      try {
        await loadCustomDecks();
      } catch (error) {
        console.error(error);
      }

      renderDeckSelect();
      renderCenterSelect();
      renderAll();

      if (!supportsCustomDecks()) {
        $("#addDeckBtn").disabled = true;
        showToast("Este navegador no puede guardar barajas personalizadas.");
      }
    }

    initApp();
  </script>
</body>
</html>
